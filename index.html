/* Layout: a horizontal "playlist" — one full-screen slide per track. ≥1024px: media stage left, story column right (staircase quote → title → body). <1024px: stacked single column. A music timeline runs along the bottom; single light theme by choice, faithful to the original. */
:root {
  --paper: #F2F2F2;
  --ink: #0D0D0D;
  --ink-soft: #1E1E1E;
  --white: #FFFFFF;
  --orange: #FF7918;
  --spider: #FF8C42;
  --yellow: #FFC300;
  --outline: #BDBDBD;
  --dot: rgba(182, 180, 180, .6);
  --muted: rgba(13, 13, 13, .58);
  --line: rgba(13, 13, 13, .16);

  --f-display: 'Brule', 'Fraunces', Georgia, serif;
  --f-script: 'JV Signature', 'Segoe Script', 'Brush Script MT', cursive;
  --f-acorn: 'Acorn', 'Work Sans', system-ui, sans-serif;
  --f-body: 'FranceTV Brown', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --gut: clamp(16px, 3.6vw, 72px);
  --hdr: 156px;      /* space kept clear under the header */
  --ftr: 118px;      /* space kept clear above the timeline */
  --cover: 96px;
  --step: clamp(16px, 2.2vw, 64px);   /* staircase indent */
  --ease: cubic-bezier(.22, .8, .24, 1);
  color-scheme: light;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
.no-anim #rail { transition: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; overflow: hidden;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ================= Stage ================= */
#app { position: fixed; inset: 0; overflow: hidden; background: var(--paper); }
#rail { position: absolute; inset: 0; display: flex; transition: transform .75s var(--ease); will-change: transform; }
.track { position: relative; flex: 0 0 100vw; width: 100vw; height: 100%; overflow: hidden; background: var(--paper); opacity: .25; transition: opacity .5s ease; }
.track.is-active { opacity: 1; }
.track::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px); background-size: 32px 32px;
}
.track.intro::before, .track.outro::before, .track.t4::before { display: none; }

/* reveal on activation */
.rv { opacity: 0; transform: translateY(24px); transition: opacity .6s ease .1s, transform .6s var(--ease) .1s; }
.rv-x { opacity: 0; transform: translateX(-24px); transition: opacity .5s ease .2s, transform .5s var(--ease) .2s; }
.rv-f { opacity: 0; transition: opacity .5s ease; }
.is-active .rv, .is-active .rv-x, .is-active .rv-f { opacity: 1; transform: none; }
.is-active .d1 { transition-delay: .35s; } .is-active .d2 { transition-delay: .45s; }
.is-active .d3 { transition-delay: .55s; } .is-active .d4 { transition-delay: .65s; }

/* ================= Type ================= */
.quote {
  font-family: var(--f-display); font-weight: 700; line-height: 1.02; margin: 0; letter-spacing: -.005em;
  color: transparent; -webkit-text-stroke: 1px var(--outline); text-wrap: balance;
}
.song { --sh: clamp(1px, .028em, 2.5px); font-family: var(--f-display); font-weight: 700; line-height: .98; margin: 0; color: var(--orange); text-shadow: var(--sh) var(--sh) 0 var(--ink-soft); text-wrap: balance; }
.artist { font-family: var(--f-script); line-height: 1.1; margin: 0; color: var(--ink); font-weight: 400; }
.h3 { font-family: var(--f-acorn); font-weight: 700; font-size: 20px; line-height: 1.2; margin: 0 0 8px; }
.copy { font-size: 16px; line-height: 1.55; margin: 0; white-space: pre-line; }
.copy strong, .copy b { font-weight: 700; }
.implied p { margin: 0 0 6px; font-size: 16px; line-height: 1.5; }
.implied strong { font-weight: 700; }
.impact { position: relative; padding-left: 16px; }
.impact::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 3px; background: var(--orange); }
.impact-link { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; transition: color .2s; }
.impact-link:hover { color: var(--orange); }

/* ================= Intro / outro ================= */
.track .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }
.track.intro::after, .track.outro::after { content: ''; position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 50%, rgba(0,0,0,.18), transparent 75%); pointer-events: none; }
.io { position: relative; z-index: 2; height: 100%; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: var(--hdr) var(--gut) var(--ftr); box-sizing: border-box; }
.io-inner { max-width: 760px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(12px, 2.4vh, 24px); color: var(--white); margin: auto; }
.io-the { font-family: var(--f-script); font-weight: 400; font-size: clamp(42px, 5vw, 76px); line-height: 1; margin: 0; text-align: center; }
.intro .io-the { margin-bottom: calc(clamp(42px, 5vw, 76px) * -.42); transform: translateX(-12%); }
.outro .io-the { font-size: clamp(54px, 6.4vw, 104px); margin-bottom: 4px; }
.io-title { --sh: clamp(1.5px, .022em, 3px); font-family: var(--f-display); font-weight: 700; font-size: clamp(64px, 10.5vw, 168px); line-height: .95; margin: 0; text-shadow: var(--sh) var(--sh) 0 var(--orange); }
.io-copy { font-family: var(--f-acorn); font-size: clamp(16px, 1.8vw, 26px); line-height: 1.4; margin: clamp(4px, 1.4vh, 16px) 0 0; color: rgba(255,255,255,.92); max-width: 30ch; text-wrap: balance; }
.glass-btn {
  position: relative; display: inline-block; margin-top: clamp(12px, 2.6vh, 32px); padding: clamp(12px, 1.4vw, 16px) clamp(22px, 2.4vw, 34px); border-radius: 14px; text-decoration: none;
  font-family: var(--f-acorn); font-weight: 700; font-size: clamp(17px, 1.6vw, 24px); color: var(--white);
  border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.04); box-shadow: 0 10px 24px -6px rgba(0,0,0,.25);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); transition: background .2s, transform .2s;
}
.glass-btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
.platforms { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; margin-top: 8px; }
.platforms a { font-size: 13px; text-decoration: none; color: rgba(255,255,255,.8); padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); transition: color .2s, border-color .2s, background .2s; }
.platforms a:hover { color: var(--white); border-color: rgba(255,255,255,.65); background: rgba(255,255,255,.08); }

/* ================= Chapter (centered) layout ================= */
.cen {
  position: absolute; inset: 0; z-index: 2; overflow-y: auto; box-sizing: border-box; scrollbar-width: none;
  display: flex; flex-direction: column; align-items: center; justify-content: safe center; text-align: center;
  padding: var(--hdr) var(--gut) var(--ftr); gap: clamp(20px, 4.5vh, 56px);
}
.cen::-webkit-scrollbar { display: none; }
.cen .quote { font-size: clamp(26px, 3.5vw, 58px); max-width: 980px; }
.cen-group { max-width: 900px; display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.6vh, 26px); }
.cen-group .tt { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cen-group .song { font-size: clamp(44px, 6.6vw, 108px); }
.cen-group .artist { font-size: clamp(24px, 2.4vw, 38px); }
.cen-story { font-family: var(--f-acorn); font-size: clamp(17px, 1.55vw, 24px); line-height: 1.5; max-width: 34ch; margin: 0; white-space: pre-line; text-wrap: balance; }
.cen-chapter { font-family: var(--f-acorn); font-weight: 300; font-size: clamp(16px, 1.4vw, 22px); margin: 0; letter-spacing: .02em; }
.human-bg { position: absolute; top: -10vh; left: -10vw; width: 120vw; height: 120vh; pointer-events: none; z-index: 0; overflow: hidden; }
.human-bg div { position: absolute; left: 0; white-space: nowrap; display: flex; }
.human-bg span { font-family: var(--f-display); font-weight: 700; font-size: 54px; line-height: 1; margin-right: 100px; color: transparent; -webkit-text-stroke: 1px #C4C4C4; opacity: .4; }

/* ================= Experience layout ================= */
.std-grid { position: absolute; inset: 0; z-index: 2; }
.std-col { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; box-sizing: border-box; }
.std-col::-webkit-scrollbar { display: none; }
.std-quote { pointer-events: none; }
.std-title { display: flex; align-items: baseline; gap: 6px 20px; flex-wrap: wrap; }
.std-body { display: flex; flex-direction: column; gap: clamp(24px, 4vh, 40px); }
.media-cell { display: none; }
.m-media { display: flex; justify-content: center; width: 100%; }

/* ≥1024: two columns, media fitted into its own cell */
@media (min-width: 1024px) {
  .std-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: clamp(28px, 3.4vw, 80px);
    padding: 0 var(--gut); max-width: 1760px; margin: 0 auto; box-sizing: border-box;
  }
  .media-cell { display: block; position: relative; margin: calc(var(--hdr) - 40px) 0 calc(var(--ftr) + 8px); }
  .stage { position: absolute; left: 50%; top: 50%; transform-origin: center; transform: translate(-50%, -50%) scale(var(--s, 1)); }
  .std-col {
    position: relative; inset: auto; height: 100%; padding: var(--hdr) 4px calc(var(--ftr) + 48px) 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent calc(var(--hdr) - 36px), #000 calc(var(--hdr) - 4px), #000 calc(100% - var(--ftr) - 56px), transparent calc(100% - var(--ftr) - 8px));
            mask-image: linear-gradient(to bottom, transparent calc(var(--hdr) - 36px), #000 calc(var(--hdr) - 4px), #000 calc(100% - var(--ftr) - 56px), transparent calc(100% - var(--ftr) - 8px));
  }
  .std-quote .quote { font-size: clamp(32px, 3.4vw, 62px); }
  .std-title { margin: clamp(10px, 1.6vh, 18px) 0 clamp(24px, 4vh, 40px) var(--step); }
  .std-title .song { font-size: clamp(32px, 3vw, 54px); }
  .std-title .artist { font-size: clamp(26px, 2.3vw, 40px); }
  .std-body { margin-left: calc(var(--step) * 1.5); max-width: 70ch; }
  .copy, .implied p { font-size: clamp(16px, 1.15vw, 18px); }
  .copy.lead { font-size: clamp(17px, 1.3vw, 20px); line-height: 1.5; }
  .h3 { font-size: clamp(20px, 1.4vw, 23px); }
  .m-media { display: none; }
}

/* <1024: stacked single column */
@media (max-width: 1023px) {
  .std-col { padding: var(--hdr) var(--gut) calc(var(--ftr) + 40px); text-align: center; }
  .std-col > * { max-width: 680px; margin-inline: auto; }
  .std-quote .quote { font-size: clamp(22px, 4.6vw, 40px); line-height: 1.08; }
  .std-title { justify-content: center; flex-direction: column; align-items: center; margin-top: 14px; }
  .std-title .song { font-size: clamp(28px, 5.4vw, 46px); }
  .std-title .artist { font-size: clamp(22px, 4.2vw, 34px); }
  .m-media { margin-top: 28px; margin-bottom: 8px; }
  .std-body { margin-top: 28px; text-align: left; }
}

/* ================= Header ================= */
#header {
  position: fixed; z-index: 50; top: 0; left: 0; right: 0; pointer-events: none;
  padding: calc(28px + env(safe-area-inset-top, 0px)) var(--gut) 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  max-width: 1760px; margin: 0 auto;
}
.logo { pointer-events: auto; font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 2.7vw, 46px); line-height: 1; color: var(--ink); transition: color .4s; white-space: nowrap; margin-top: 10px; }
.dark-ui .logo { color: var(--white); }
.player { position: relative; pointer-events: auto; }
.player::before {
  content: ''; position: absolute; inset: -12px; border-radius: 18px; background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 12px 24px -8px rgba(0,0,0,.14);
}
.dark-ui .player::before { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
.player-in { position: relative; display: flex; align-items: stretch; gap: 20px; }
.cover { position: relative; width: var(--cover); height: var(--cover); border-radius: 8px; overflow: hidden; flex: none; box-shadow: 0 10px 18px -6px rgba(0,0,0,.3); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; animation: pop .4s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.85); } }
.cover .ov { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; }
.cover:hover .ov, .cover .ov:focus-visible { opacity: 1; }
.cover .ov svg { width: 40%; height: 40%; fill: #fff; }
.eq { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 2px; align-items: flex-end; height: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
.eq i { width: 3px; background: #fff; border-radius: 1px; animation: eq 1s ease-in-out infinite; box-shadow: 0 0 2px rgba(0,0,0,.5); }
.eq i:nth-child(2) { animation-delay: -.4s; } .eq i:nth-child(3) { animation-delay: -.7s; }
@keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
.playing .eq { opacity: 1; }
.playing .cover:hover .eq { opacity: 0; }
.pmeta { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; width: 236px; }
.pmeta .t { font-size: 14px; font-weight: 700; line-height: 1.25; color: rgba(13,13,13,.92); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pmeta .a { font-size: 12px; line-height: 1.25; color: var(--muted); margin: 3px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dark-ui .pmeta .t { color: rgba(255,255,255,.95); } .dark-ui .pmeta .a, .dark-ui .count { color: rgba(255,255,255,.65); }
.ctrls { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
.ib { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; transition: background .2s, transform .15s; text-decoration: none; }
.ib:hover { background: rgba(0,0,0,.06); transform: scale(1.08); }
.dark-ui .ib:hover { background: rgba(255,255,255,.12); }
.ib:active { transform: scale(.94); }
.ib svg { width: 20px; height: 20px; fill: var(--ink); stroke: none; transition: fill .4s, stroke .4s; }
.ib svg.st { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ib.yt-out svg { width: 17px; height: 17px; }
.dark-ui .ib svg { fill: var(--white); } .dark-ui .ib svg.st { fill: none; stroke: var(--white); }
.count { margin-left: auto; padding-left: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mcount { display: none; }

/* ================= Music timeline ================= */
#timeline { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; padding: 38px var(--gut) calc(16px + env(safe-area-inset-bottom, 0px)); }
#timeline::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(242,242,242,0), var(--paper) 30%); transition: opacity .6s; }
.dark-ui #timeline::before { opacity: 0; }
.tl-wrap { position: relative; max-width: calc(1760px - 2 * var(--gut)); margin: 0 auto; }
.tl { position: relative; height: 24px; }
.tl-line, .tl-prog, .tl-seg { position: absolute; top: 50%; transform: translateY(-50%); border-radius: 99px; }
.tl-line { left: 0; right: 0; height: 4px; background: var(--line); }
.tl-prog { left: 0; height: 4px; width: 0; background: var(--ink); transition: width .5s var(--ease); }
.tl-seg { height: 24px; cursor: pointer; touch-action: none; transition: left .5s var(--ease), width .5s var(--ease); }
.tl-seg::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 8px; transform: translateY(-50%); border-radius: 99px; background: rgba(255,121,24,.16); opacity: 0; transition: opacity .3s; }
.started .tl-seg::before, .tl-seg:hover::before { opacity: 1; }
.tl-fill { position: absolute; left: 0; top: 50%; height: 4px; transform: translateY(-50%); width: 0; background: var(--orange); border-radius: 99px; }
.tl-head { position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 3px rgba(255,121,24,.22), 0 2px 6px rgba(0,0,0,.25); opacity: 0; transform: scale(.4); transition: opacity .3s, transform .3s; }
.started .tl-head { opacity: 1; transform: none; }
.playing .tl-head { animation: halo 1.6s ease-in-out infinite; }
@keyframes halo { 50% { box-shadow: 0 0 0 7px rgba(255,121,24,.12), 0 2px 6px rgba(0,0,0,.25); } }
.tl-seg.drag .tl-head { transform: scale(1.25); }
.dark-ui .tl-line { background: rgba(255,255,255,.25); } .dark-ui .tl-prog { background: var(--white); }
.tl-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; display: grid; place-items: center; z-index: 2; }
.tl-dot i { display: block; width: 8px; height: 8px; border-radius: 99px; background: rgba(13,13,13,.3); transition: transform .15s, background .3s; }
.tl-dot.past i { background: var(--ink); }
.tl-dot.on i { width: 16px; height: 16px; background: var(--ink); border: 2px solid var(--white); box-shadow: 0 4px 8px rgba(0,0,0,.2); }
.tl-dot.nxt i { background: var(--orange); }
.dark-ui .tl-dot i { background: rgba(255,255,255,.4); } .dark-ui .tl-dot.past i { background: var(--white); }
.dark-ui .tl-dot.on i { background: var(--white); border-color: var(--ink); }
.tl-dot:hover i { transform: scale(1.3); }
.tip {
  position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); white-space: nowrap; text-align: center;
  padding: 8px 14px; border-radius: 14px; background: rgba(255,255,255,.88); border: 1px solid rgba(255,255,255,.6);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 20px -6px rgba(0,0,0,.18);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; font-size: 14px; z-index: 5; color: var(--ink);
}
.tip b { display: block; font-weight: 700; }
.tip small { display: block; font-size: 12px; color: var(--muted); }
.tip.l { left: -6px; transform: none; text-align: left; } .tip.r { left: auto; right: -6px; transform: none; text-align: right; }
.tl-dot:hover .tip, .tl-dot:focus-visible .tip { opacity: 1; }
.tl-ch { position: absolute; bottom: calc(100% + 2px); transform: translateX(-4px); font-family: var(--f-acorn); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; padding: 2px 4px; border-radius: 4px; transition: color .2s; }
.tl-ch b { font-weight: 700; margin-right: 6px; color: var(--ink); }
.tl-ch:hover, .tl-ch.on { color: var(--ink); }
.tl-ch.on b { color: var(--orange); }
.dark-ui .tl-ch { color: rgba(255,255,255,.65); } .dark-ui .tl-ch b, .dark-ui .tl-ch:hover { color: var(--white); }
.tl-meta { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin: 14px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-meta .c { font-family: var(--f-acorn); }
.tl-meta .r { text-align: right; }
.tl-meta .time b { color: var(--ink); font-weight: 700; }
.dark-ui .tl-meta { color: rgba(255,255,255,.7); } .dark-ui .tl-meta .time b { color: var(--white); }

/* ================= Hints / toast ================= */
.hint {
  position: fixed; z-index: 40; right: var(--gut); bottom: calc(var(--ftr) + 10px); padding: 10px 34px 11px 14px; border-radius: 14px; width: max-content; max-width: 240px; box-sizing: border-box;
  background: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 10px 20px -6px rgba(0,0,0,.15); font-size: 12px; color: var(--ink); animation: hint-in .6s ease 1s both;
}
.hint.clear { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.3); backdrop-filter: blur(6px); color: rgba(255,255,255,.9); }
.hint p { margin: 0; line-height: 1.45; } .hint .lbl { opacity: .6; margin-bottom: 3px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.hint .x { position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; font-size: 16px; line-height: 1; opacity: .7; }
.hint .x:hover { opacity: 1; }
@keyframes hint-in { from { opacity: 0; transform: translateX(20px); } }
#toast {
  position: fixed; z-index: 120; left: 50%; top: 20px; transform: translate(-50%, -160%); transition: transform .4s var(--ease);
  background: var(--ink); color: var(--white); border-radius: 12px; padding: 10px 14px 10px 16px; font-size: 13px; line-height: 1.4; max-width: min(560px, calc(100vw - 32px));
  display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); box-sizing: border-box;
}
#toast.on { transform: translate(-50%, 0); visibility: visible; }
#toast:not(.on) { visibility: hidden; transition: transform .4s var(--ease), visibility 0s .4s; }
#toast a { color: var(--orange); white-space: nowrap; font-weight: 700; }

/* ================= Lightbox ================= */
#lb { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 56px; animation: fade .25s ease; }
#lb[hidden] { display: none !important; }
@keyframes fade { from { opacity: 0; } }
#lb figure { margin: 0; display: flex; flex-direction: column; align-items: center; max-width: 100%; max-height: 100%; animation: zoom .3s ease; }
@keyframes zoom { from { transform: scale(.94); opacity: 0; } }
#lb img { max-width: 100%; max-height: 80vh; width: auto; height: auto; object-fit: contain; border-radius: 8px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); }
#lb figcaption { color: rgba(255,255,255,.85); margin-top: 16px; text-align: center; font-size: 15px; max-width: 60ch; }
#lb .n { color: rgba(255,255,255,.55); font-size: 13px; margin-top: 6px; font-variant-numeric: tabular-nums; }
#lb .lb-b { position: absolute; color: #fff; padding: 10px; border-radius: 999px; transition: background .2s; }
#lb .lb-b:hover { background: rgba(255,255,255,.12); }
#lb .lb-b svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
#lb .close { top: 14px; right: 14px; } #lb .prev { left: 10px; top: 50%; transform: translateY(-50%); } #lb .next { right: 10px; top: 50%; transform: translateY(-50%); }

/* ================= Media components ================= */
.zoomable { position: relative; cursor: zoom-in; display: block; transition: transform .25s ease; }
.zoomable:hover { transform: scale(1.02); }
.zoomable .hov { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.zoomable .hov span { opacity: 0; transition: opacity .2s; color: #fff; background: rgba(0,0,0,.55); padding: 5px 12px; border-radius: 6px; font-size: 14px; }
.zoomable:hover .hov span, .zoomable:focus-visible .hov span { opacity: 1; }
.shadow { box-shadow: 0 10px 18px -6px rgba(0,0,0,.18), 0 4px 6px -4px rgba(0,0,0,.1); }
.shadow-xl { box-shadow: 0 22px 30px -10px rgba(0,0,0,.22), 0 8px 10px -6px rgba(0,0,0,.1); }

.vcard { position: relative; display: block; width: 360px; max-width: 100%; border-radius: 14px; overflow: hidden; text-decoration: none; background: #141414; color: #fff; transition: transform .25s var(--ease); box-shadow: 0 30px 50px -22px rgba(13,13,13,.5), 0 10px 20px -10px rgba(13,13,13,.25); }
.vcard:hover { transform: translateY(-2px) scale(1.015); }
.vcard .vimg { position: relative; display: block; aspect-ratio: 16/9; overflow: hidden; }
.vcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
.vcard:hover img { transform: scale(1.04); }

      <div class="handle"><span class="grip"></span></div><span class="tag l">Outlined</span><span class="tag r">Filled</span></div></div>`);
  const box = $('.split', card), top = $('.lyr.top', card), handle = $('.handle', card);
  const set = (p) => { p = Math.max(0, Math.min(100, p)); top.style.clipPath = `inset(0 ${100 - p}% 0 0)`; handle.style.left = p + '%'; box.setAttribute('aria-valuenow', Math.round(p)); box._p = p; };
  set(50);

  box.addEventListener('pointerdown', (e) => { down = true; box.setPointerCapture(e.pointerId); at(e); e.stopPropagation(); });
  box.addEventListener('pointermove', (e) => { if (down) { at(e); e.stopPropagation(); } });

// Skill radar: draggable points, level rings, labels; the viewBox is fitted to the drawing once fonts are in
const spiders = [];
function spider(mobile) {
  const size = 525, c = size / 2, maxR = 185, L = 5, n = SKILLS.length;
  const pt = (i, v) => { const a = i * 2 * Math.PI / n - Math.PI / 2, r = v / L * maxR; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
  const ring = (l) => SKILLS.map((_, i) => pt(i, l).map((q) => q.toFixed(1)).join(',')).join(' ');
  let rings = '';
  for (let l = 1; l < L; l++) rings += `<polygon points="${ring(l)}" fill="none" stroke="#EDEDED" stroke-width="1"/>`;
  let spokes = '', grid = '';
  SKILLS.forEach((_, i) => { const [x, y] = pt(i, L); spokes += `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#F0F0F0" stroke-width="1"/>`; });
  for (let l = 1; l <= L; l++) SKILLS.forEach((_, i) => { const [x, y] = pt(i, l); grid += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="#C8C8C8"/>`; });
  let labels = '';
  SKILLS.forEach(([name, desc], i) => {
    const a = i * 2 * Math.PI / n - Math.PI / 2;
    const lr = maxR + (i === 0 ? 64 : 24);
    const x = c + lr * Math.cos(a), y = c + lr * Math.sin(a);
    const anchor = x < c - 10 ? 'end' : x > c + 10 ? 'start' : 'middle';
    labels += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="sk-t">${name}</text>`;
    desc.forEach((d, j) => { labels += `<text x="${x.toFixed(1)}" y="${(y + 15 + j * 13).toFixed(1)}" text-anchor="${anchor}" class="sk-d">${esc(d)}</text>`; });
  });
  const el = h(`<div class="spider ${mobile ? 'spider-m' : ''}" data-no-swipe><svg viewBox="-150 -40 825 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Skill evaluation radar. Drag the orange dots to change it.">
    <g class="all"><polygon points="${ring(L)}" fill="#F6F6F6" stroke="#DCDCDC" stroke-width="1.5"/>${rings}${spokes}${grid}<circle cx="${c}" cy="${c}" r="3" fill="#BEBEBE"/>
    <path class="area" fill="#FF8C42" fill-opacity=".45" stroke="#FF7918" stroke-width="2.5" stroke-linejoin="round"/>
    <g class="pts"></g>${labels}</g></svg></div>`);
  const svg = $('svg', el), area = $('.area', el), g = $('.pts', el);
  let vals = SKILLS.map(() => 2 + rnd() * 3);
  const dots = SKILLS.map((_, i) => {
    const d = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    d.setAttribute('r', mobile ? 11 : 7.5); d.setAttribute('fill', '#FF7918'); d.setAttribute('stroke', '#fff'); d.setAttribute('stroke-width', mobile ? 3 : 2.5);
    d.setAttribute('class', 'pt'); d.dataset.i = i;
    g.appendChild(d); return d;
  });
  const draw = () => {
    area.setAttribute('d', 'M ' + vals.map((v, i) => pt(i, v).map((q) => q.toFixed(1)).join(',')).join(' L ') + ' Z');
    vals.forEach((v, i) => { const [x, y] = pt(i, v); dots[i].setAttribute('cx', x.toFixed(1)); dots[i].setAttribute('cy', y.toFixed(1)); });
  };
  let drag = null;
  svg.addEventListener('pointerdown', (e) => {
    const t = e.target.closest('.pt'); if (!t) return;
    drag = +t.dataset.i; t.classList.add('drag'); svg.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation();
  });
  svg.addEventListener('pointermove', (e) => {
    if (drag === null) return;
    e.stopPropagation();
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    vals[drag] = Math.max(0, Math.min(L, Math.hypot(q.x - c, q.y - c) / maxR * L));
    draw();
  });
  const up = () => { if (drag !== null) dots[drag].classList.remove('drag'); drag = null; };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  el._reset = () => { vals = SKILLS.map(() => 2 + Math.random() * 3); draw(); };
  el._fit = () => {
    try {
      const b = $('.all', svg).getBBox(); if (!b.width) return;
      const pad = 14;
      svg.setAttribute('viewBox', `${(b.x - pad).toFixed(0)} ${(b.y - pad).toFixed(0)} ${(b.width + pad * 2).toFixed(0)} ${(b.height + pad * 2).toFixed(0)}`);
    } catch (_) {}
  };
  draw();
  spiders.push(el);
  return el;
}

function avatarRing() {
  seed = 99;
  const ring = h('<div class="ring" aria-hidden="true"></div>');
  const total = 40, per = 10;
  for (let i = 0; i < total; i++) {
    const cell = Math.floor(rnd() * 39), col = cell % 7, row = Math.floor(cell / 7);
    const edge = Math.floor(i / per), pos = (i % per) / per, off = (rnd() - .5) * 10, rot = i / total * 360 + (rnd() - .5) * 20;
    let left, top;
    if (edge === 0) { left = pos * 100 + off; top = -5 + rnd() * 8; }
    else if (edge === 1) { left = 97 + rnd() * 8; top = pos * 100 + off; }
    else if (edge === 2) { left = pos * 100 + off; top = 97 + rnd() * 8; }
    else { left = -5 + rnd() * 8; top = pos * 100 + off; }
    left = Math.max(-10, Math.min(110, left)); top = Math.max(-10, Math.min(110, top));
    const a = document.createElement('i');
    a.style.cssText = `left:${left.toFixed(1)}%;top:${top.toFixed(1)}%;background-image:url(assets/avatar-crowd.png);background-position:-${col * 56}px -${row * 112}px;--r:${rot.toFixed(0)}deg;--d:${(rnd() * 1.5).toFixed(2)}s`;
    ring.appendChild(a);
  }
  return ring;
}

  if (m.desk) $('.media-cell', grid).appendChild(m.desk);
  const col = h(`<div class="std-col rv-f" tabindex="-1">
      <div class="std-quote"><p class="quote">"${esc(t.quote)}"</p></div>
      <div class="std-title"><h2 class="song">${esc(t.songTitle)}</h2><p class="artist">- ${esc(t.artist)}</p></div>
      <div class="m-media"></div>
      <div class="std-body">
        <div class="rv-f d1"><p class="copy lead">${esc(t.story)}</p></div>
        <div class="rv-f d2"><h3 class="h3">At the time</h3><p class="copy">${t.atTheTime}</p></div>
        ${t.itImplied && t.itImplied.length ? `<div class="rv-f d3"><h3 class="h3">It Implied</h3><div class="implied">${implied(t.itImplied)}</div></div>` : ''}
        <div class="rv-f d4 impact"><h3 class="h3">The Impact</h3>${t.impactLink
          ? `<a class="copy impact-link" href="${t.impactLink}" target="_blank" rel="noopener noreferrer">${esc(t.impact)}</a>`
          : `<p class="copy">${esc(t.impact)}</p>`}</div>
      </div></div>`);
  if (m.mob) $('.m-media', col).appendChild(m.mob); else $('.m-media', col).remove();
  grid.appendChild(col);
  sec.appendChild(grid);
  return sec;
}

/* ---------- build UI ---------- */
const rail = $('#rail');
PLAYLIST.forEach((t, i) => rail.appendChild(renderTrack(t, i)));

const pos = (i) => i / (N - 1) * 100;
const tl = $('.tl');
CHAPTERS.filter((c) => c.num).forEach((c) => {
  const b = h(`<button type="button" class="tl-ch" style="left:${pos(c.at)}%" data-at="${c.at}" aria-label="Jump to chapter ${c.num}: ${esc(c.name)}"><b>${c.num}</b><span>${esc(c.name)}</span></button>`);
  b.addEventListener('click', () => go(c.at));
  tl.appendChild(b);
});
PLAYLIST.forEach((t, i) => {
  const tipCls = i === 0 ? 'l' : i === N - 1 ? 'r' : '';
  const b = h(`<button type="button" class="tl-dot" style="left:${pos(i)}%" aria-label="Go to track ${i + 1}: ${esc(t.songTitle)}"><i></i><span class="tip ${tipCls}"><b>${esc(t.tipTitle || t.songTitle)}</b><small>${esc(t.tipSub || t.artist)}</small></span></button>`);
  b.addEventListener('click', () => go(i));
  tl.appendChild(b);
});

// mobile playlist sheet, grouped by chapter
const shList = $('.sh-list');
PLAYLIST.forEach((t, i) => {
  const ch = CHAPTERS.find((c) => c.at === i);
  if (ch) shList.appendChild(h(`<p class="sh-ch">${ch.num ? `<b>${ch.num}</b>` : ''}${esc(ch.name)}</p>`));
  const b = h(`<button type="button" class="sh-item"><img src="${t.cover}" alt="" loading="lazy"><span class="m"><p class="t">${esc(t.songTitle)}</p><p class="a">${esc(t.artist)}</p></span><span class="n">${String(i + 1).padStart(2, '0')}</span></button>`);
  b.addEventListener('click', () => { go(i); sheet(false); });
  shList.appendChild(b);
});
function sheet(on) {
  document.body.classList.toggle('sheet-open', on);
  if (on) { const cur = $$('.sh-item')[S.cur]; if (cur) cur.scrollIntoView({ block: 'center' }); $('#msheet .mb').focus({ preventScroll: true }); }
}

/* ---------- fit media stages into their column ---------- */
function fitStages() {
  spiders.forEach((s) => s._fit());
  $$('.media-cell').forEach((cell) => {
    const st = cell.firstElementChild; if (!st) return;
    const cw = cell.clientWidth, ch = cell.clientHeight; if (!cw || !ch) return;
    const s = Math.min(cw / +st.dataset.w, ch / +st.dataset.h, 1.12);
    st.style.setProperty('--s', s.toFixed(3));
  });
}
let fitRaf = 0;
const queueFit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitStages); };
addEventListener('resize', queueFit);
if (window.ResizeObserver) new ResizeObserver(queueFit).observe($('#app'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit);

/* ---------- audio engine (YouTube) ----------
   A hidden YouTube player streams each song, like the Figma Make version. When YouTube can't load
   (e.g. inside the Claude preview) or a video refuses embedding, the timeline runs silently at the
   song's real length so the journey still flows. */
let yt = null, mode = 'probe';   // 'probe' → 'audio' (YouTube ready) | 'sim'
let simTrack = false, lastTick = 0, retryT = 0;
const ytUrl = () => `https://www.youtube.com/watch?v=${PLAYLIST[S.cur].youtubeId}`;
const useAudio = () => mode === 'audio' && !simTrack;
const duration = () => {
  if (useAudio()) { try { const d = yt.getDuration(); if (d > 0) return d; } catch (_) {} return 0; }
  return SIM_DURATIONS[S.cur];
};

function loadYouTube() {
  const fail = setTimeout(() => { if (mode === 'probe') { mode = 'sim'; if (S.playing) audioPlay(); } }, 8000);
  window.onYouTubeIframeAPIReady = () => {
    try {
      yt = new YT.Player('yt', {
        width: 200, height: 200, videoId: PLAYLIST[S.cur].youtubeId,
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, playsinline: 1, enablejsapi: 1, rel: 0, iv_load_policy: 3, origin: location.origin },
        events: {
          onReady: () => {
            clearTimeout(fail);
            mode = 'audio'; S.embeds = true; document.body.classList.add('embeds');
            yt.setVolume(Math.round(S.volume * 100)); if (S.muted) yt.mute(); else yt.unMute();
            if (S.time > 0 && !simTrack) yt.seekTo(S.time, true);
            if (S.playing) audioPlay();
          },
          onStateChange: (e) => { if (e.data === 0) onEnd(); else if (!S.playing) { const d = duration(); if (d) { S.dur = d; drawProgress(); } } },
          onError: () => {
            // video unavailable or embedding refused: keep the journey going silently for this track
            simTrack = true; S.dur = SIM_DURATIONS[S.cur]; drawProgress();
          }
        }
      });
    } catch (_) { mode = 'sim'; }
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
  s.onerror = () => { clearTimeout(fail); mode = 'sim'; if (S.playing) audioPlay(); };
  document.head.appendChild(s);
}
function audioPlay() {
  if (useAudio()) {
    try { yt.unMute(); if (S.muted) yt.mute(); yt.playVideo(); } catch (_) {}
    // some browsers need a nudge right after a track change
    clearTimeout(retryT);
    let tries = 0;
    const check = () => {
      if (!S.playing || !useAudio()) return;
      let st; try { st = yt.getPlayerState(); } catch (_) { return; }
      if (st !== 1 && st !== 3 && tries++ < 3) { try { yt.playVideo(); } catch (_) {} retryT = setTimeout(check, 400 * tries); }
    };
    retryT = setTimeout(check, 600);
    return;
  }
  if (mode === 'sim' && !S.toastShown) {
    S.toastShown = true;
    toast(`<span>Sound can't play inside this preview, so the timeline runs silently at each song's length.</span><a href="${ytUrl()}" target="_blank" rel="noopener noreferrer">Listen on YouTube ↗</a>`);
  }
}
function audioPause() { clearTimeout(retryT); if (mode === 'audio') { try { yt.pauseVideo(); } catch (_) {} } }
function audioLoad() {
  S.time = 0; simTrack = false;
  if (mode === 'audio') {
    const id = PLAYLIST[S.cur].youtubeId;
    try { if (S.playing) { yt.loadVideoById({ videoId: id, startSeconds: 0 }); audioPlay(); } else yt.cueVideoById(id); } catch (_) {}
  }
  S.dur = mode === 'audio' ? 0 : SIM_DURATIONS[S.cur];
}
function audioMute() { if (mode === 'audio') { try { S.muted ? yt.mute() : yt.unMute(); } catch (_) {} } }
function seek(frac) {
  const d = S.dur || duration(); if (!d) return;
  S.time = Math.max(0, Math.min(d - .25, frac * d));
  if (useAudio()) { try { yt.seekTo(S.time, true); } catch (_) {} }
  drawProgress();
}

function tick(ts) {
  const dt = lastTick ? Math.min(.25, (ts - lastTick) / 1000) : 0; lastTick = ts;
  if (S.playing) {
    if (useAudio()) {
      try {
        if (!S.seeking) S.time = yt.getCurrentTime() || 0;
        const d = yt.getDuration(); if (d > 0) S.dur = d;
      } catch (_) {}
    } else if (!S.seeking) {
      S.dur = SIM_DURATIONS[S.cur]; S.time = Math.min(S.dur, S.time + dt);
      if (S.time >= S.dur) onEnd();
    }
    drawProgress();
  }
  requestAnimationFrame(tick);
}
function onEnd() {
  if (!S.hasPlayed) return;
  if (S.cur >= N - 1) { S.playing = false; S.time = S.dur; audioPause(); syncPlay(); drawProgress(); return; }
  go(S.cur + 1);
  S.playing = true; syncPlay(); audioPlay();
}

/* ---------- navigation & sync ---------- */
let booted = false;
function go(i) {
  const n = Math.max(0, Math.min(N - 1, i));
  if (n === S.cur && booted) return;
  S.cur = n;
  audioLoad();
  sync();
  try { history.replaceState(null, '', '#track-' + (n + 1)); } catch (_) {}
}
const next = () => go(S.cur + 1);
const prev = () => go(S.cur - 1);

function togglePlay() {
  S.playing = !S.playing;
  if (S.playing) {
    S.hasPlayed = true;
    if (!useAudio() && S.time >= S.dur) S.time = 0;
    audioPlay();
  } else audioPause();
  syncPlay();
}
function toggleMute() { S.muted = !S.muted; audioMute(); syncPlay(); }

function syncPlay() {
  const b = document.body;
  b.classList.toggle('playing', S.playing);
  b.classList.toggle('started', S.playing || S.time > 0);
  $$('[data-act="play"]').forEach((el) => { el.innerHTML = S.playing ? I.pause : I.play; el.setAttribute('aria-label', S.playing ? 'Pause' : 'Play'); });
  $$('[data-act="mute"]').forEach((el) => { el.innerHTML = S.muted ? I.mute : I.vol; el.setAttribute('aria-label', S.muted ? 'Unmute' : 'Mute'); });
}

const tlSeg = $('.tl-seg'), tlFill = $('.tl-fill'), tlHead = $('.tl-head'), tlProg = $('.tl-prog');
function drawProgress() {
  const d = S.dur || duration();
  const p = d > 0 ? Math.min(1, S.time / d) : 0;
  const a = pos(S.cur), b = S.cur < N - 1 ? pos(S.cur + 1) : a;
  tlProg.style.width = a + '%';
  tlSeg.style.left = a + '%'; tlSeg.style.width = (b - a) + '%';
  tlSeg.hidden = b === a;
  tlFill.style.width = (p * 100) + '%'; tlHead.style.left = (p * 100) + '%';
  $('.tl-meta .time').innerHTML = `<b>${fmt(S.time)}</b> / ${d ? fmt(d) : '--:--'}`;
  $('.mp-prog i').style.width = (p * 100) + '%'; $('.mp-prog b').style.left = (p * 100) + '%';
  $('.mp-bar .e').textContent = fmt(S.time); $('.mp-bar .d').textContent = d ? fmt(d) : '--:--';
  tlSeg.setAttribute('aria-valuenow', Math.round(S.time)); tlSeg.setAttribute('aria-valuemax', Math.round(d || 0));
  tlSeg.setAttribute('aria-valuetext', `${fmt(S.time)} of ${fmt(d)}`);
  document.body.classList.toggle('started', S.playing || S.time > 0);
}

// scrub inside the current A→B segment (desktop) or the mobile bar
function scrubber(el) {
  let on = false;
  const f = (e) => { const r = el.getBoundingClientRect(); return (e.clientX - r.left) / r.width; };
  el.addEventListener('pointerdown', (e) => { on = true; S.seeking = true; el.classList.add('drag'); el.setPointerCapture(e.pointerId); seek(f(e)); e.stopPropagation(); });
  el.addEventListener('pointermove', (e) => { if (on) seek(f(e)); });
  const up = () => { on = false; S.seeking = false; el.classList.remove('drag'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('keydown', (e) => {
    const d = S.dur || duration(); if (!d) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); seek((S.time + (e.key === 'ArrowLeft' ? -10 : 10)) / d); }
  });
}
scrubber(tlSeg); scrubber($('.mp-prog'));

function sync() {
  const t = PLAYLIST[S.cur];
  const io = !!(t.isIntro || t.isOutro);
  rail.style.transform = `translateX(${-S.cur * 100}vw)`;
  $$('.track', rail).forEach((el, i) => {
    const on = i === S.cur;
    el.classList.toggle('is-active', on);
    el.inert = !on;
    el.setAttribute('aria-hidden', on ? 'false' : 'true');
    if (!on) $$('.std-col, .cen, .io', el).forEach((s) => { s.scrollTop = 0; });
  });
  document.body.classList.toggle('dark-ui', io);

  // header player
  const cimg = $('.cover img'); const ni = cimg.cloneNode(); ni.src = t.cover; ni.alt = `${t.songTitle} by ${t.artist}`; cimg.replaceWith(ni);
  $('.pmeta .t').textContent = t.songTitle; $('.pmeta .t').title = t.songTitle;
  $('.pmeta .a').textContent = t.artist;
  $('.count').textContent = `${S.cur + 1} / ${N}`;
  $('.mcount').textContent = `${S.cur + 1} / ${N}`;
  $$('.ext-out').forEach((a) => { a.href = ytUrl(); a.setAttribute('aria-label', `Listen to ${t.songTitle} on YouTube`); a.title = 'Listen on YouTube'; });

  // mobile player
  $('.mp-top img').src = t.cover; $('.mp-top img').alt = `${t.songTitle} by ${t.artist}`;
  $('.mp-meta .t').textContent = t.songTitle; $('.mp-meta .a').textContent = t.artist;
  $$('.sh-item').forEach((b, i) => { b.classList.toggle('on', i === S.cur); b.setAttribute('aria-current', i === S.cur ? 'true' : 'false'); });

  // timeline
  $$('.tl-dot').forEach((d, i) => {
    d.classList.toggle('on', i === S.cur); d.classList.toggle('past', i < S.cur); d.classList.toggle('nxt', i === S.cur + 1);
    d.setAttribute('aria-current', i === S.cur ? 'step' : 'false');
  });
  const ch = chapterOf(S.cur);
  $$('.tl-ch').forEach((b) => b.classList.toggle('on', +b.dataset.at === ch.at));
  $('.tl-meta .c').textContent = chapterLabel(ch);
  $('.tl-meta .m').textContent = `Track ${S.cur + 1} of ${N}`;
  tlSeg.setAttribute('aria-label', `Playback position in ${t.songTitle}`);
  drawProgress();

  renderHint();
  Avatar.setActive(S.cur === 12);
  if (activators[t.id]) activators[t.id]();
  closeLB();
  queueFit();
}

function renderHint() {
  $$('.hint').forEach((n) => n.remove());
  const H = HINTS[S.cur];
  if (!H || S.dismissed.has(S.cur)) return;
  const el = h(`<div class="hint ${H.glass === 'clear' ? 'clear' : ''}" role="note"><button type="button" class="x" aria-label="Close instructions">×</button>
    <p class="lbl">Navigation</p>${H.lines.map((l) => `<p>${esc(l)}</p>`).join('')}</div>`);
  const idx = S.cur;
  $('.x', el).addEventListener('click', () => { S.dismissed.add(idx); el.remove(); });
  document.body.appendChild(el);
}

/* ---------- avatar (track 13, "Crazy") ---------- */
const Avatar = (() => {
  const el = $('#avatar');
  const SP = { down: [0, 32, 64], left: [96, 128, 160], up: [192, 224, 256], right: [288, 320, 352], dance: [384, 416, 448, 480] };
  let active = false, x = 0, y = 0, dir = 'dance', moving = false, force = false, wf = 1, df = 0, raf = 0, last = 0, acc = 0, dacc = 0, placed = false;
  const keys = new Set();
  const logo = () => $('.logo').getBoundingClientRect();
  const draw = () => {
    const mob = isPhone(), scale = mob ? 1.25 : 2;
    const off = (force || dir === 'dance') ? SP.dance[df] : moving ? SP[dir][wf] : SP[dir][0];
    el.style.backgroundPosition = `-${off * scale}px 0`;
    if (mob) { const r = logo(); el.style.transform = `translate(${Math.round(r.right + r.height * .85 - 7.5)}px, ${Math.round(r.top + r.height / 2 - 54)}px)`; }
    else el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
  };
  const loop = (ts) => {
    const dt = last ? Math.min(50, ts - last) : 16; last = ts;
    if (!isPhone()) {
      const r = logo();
      // start beside the name: the visible character (rows 27–59 of the 64px frame) is centred on the logo
      if (!placed) { x = r.right + r.height * .85 - 12; y = r.top + r.height / 2 - 86; placed = true; }
      moving = false;
      const step = 3 * dt / 16.7;
      if (keys.has('z') || keys.has('w')) { y -= step; dir = 'up'; moving = true; }
      else if (keys.has('s')) { y += step; dir = 'down'; moving = true; }
      if (keys.has('q') || keys.has('a')) { x -= step; dir = 'left'; moving = true; }
      else if (keys.has('d')) { x += step; dir = 'right'; moving = true; }
      if (moving) force = false;
      const W = innerWidth, H = innerHeight;
      if (x < -64) x = W; else if (x > W) x = -64;
      if (y < -128) y = H; else if (y > H) y = -128;
      if (!moving && !force && x < r.right + r.height * 2.4 && y < r.bottom + 24) dir = 'dance';
    }
    acc += dt; dacc += dt;
    if (acc > 150) { wf = wf === 1 ? 2 : 1; acc = 0; }
    if (dacc > 200) { df = (df + 1) % 4; dacc = 0; }
    draw();
    raf = requestAnimationFrame(loop);
  };
  addEventListener('keydown', (e) => {
    if (!active || isPhone() || S.lightbox || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (['z', 'w', 'q', 'a', 's', 'd'].includes(k)) { e.preventDefault(); keys.add(k); }
    if (k === 'h') { e.preventDefault(); force = true; dir = 'down'; }
    if (k === 'r') { e.preventDefault(); force = !force; if (force) dir = 'down'; }
  });
  addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => keys.clear());
  addEventListener('resize', () => { placed = false; });
  return {
    setActive(on) {
      if (on === active) return;
      active = on; el.hidden = !on; keys.clear();
      if (on) { last = 0; dir = 'dance'; placed = false; raf = requestAnimationFrame(loop); } else cancelAnimationFrame(raf);
    }
  };
})();

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'next') next(); else if (a === 'prev') prev(); else if (a === 'play') togglePlay(); else if (a === 'mute') toggleMute();
  else if (a === 'start') { next(); if (mode === 'audio' && !S.playing) togglePlay(); }
  else if (a === 'first') go(0); else if (a === 'list') sheet(!document.body.classList.contains('sheet-open')); else if (a === 'sheet-close') sheet(false);
});
$('#mback').addEventListener('click', () => sheet(false));

addEventListener('keydown', (e) => {
  if (S.lightbox) {
    if (e.key === 'Escape') closeLB();
    else if (e.key === 'ArrowLeft') stepLB(-1);
    else if (e.key === 'ArrowRight') stepLB(1);
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tgt = e.target;
  if (tgt.closest && tgt.closest('.split, .tl-seg, .mp-prog')) return;
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(N - 1); }
  else if (e.key === ' ' && !(tgt.closest && tgt.closest('a, button'))) { e.preventDefault(); togglePlay(); }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
  else if (e.key === 'Escape') sheet(false);
});

// touch swipe
let tx = 0, ty = 0, tOk = false;
rail.addEventListener('touchstart', (e) => {
  if (S.lightbox || e.target.closest('[data-no-swipe]')) { tOk = false; return; }
  tOk = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
rail.addEventListener('touchend', (e) => {
  if (!tOk) return; tOk = false;
  const dx = tx - e.changedTouches[0].clientX, dy = ty - e.changedTouches[0].clientY;
  if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.abs(dx) > 50) (dx > 0 ? next : prev)();
}, { passive: true });

// trackpad horizontal swipe
let wAcc = 0, wLock = 0, wReset = 0;
rail.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) * 1.2 || e.target.closest('[data-no-swipe]')) return;
  const now = performance.now();
  clearTimeout(wReset); wReset = setTimeout(() => { wAcc = 0; }, 180);
  if (now < wLock) return;
  wAcc += e.deltaX;
  if (Math.abs(wAcc) > 70) { (wAcc > 0 ? next : prev)(); wAcc = 0; wLock = now + 900; }
}, { passive: true });

/* ---------- boot ---------- */
const m = /^#track-(\d{1,2})$/.exec(location.hash);
S.cur = m ? Math.max(0, Math.min(N - 1, +m[1] - 1)) : 0;
S.dur = SIM_DURATIONS[S.cur];
document.body.classList.add('no-anim');
sync(); syncPlay();
booted = true;
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('no-anim')));
requestAnimationFrame(tick);
loadYouTube();
})();

</script>

</body>
